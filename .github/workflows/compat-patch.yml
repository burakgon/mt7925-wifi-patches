name: Compatibility patch

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate compatibility patch
        run: ./tests/test-compat-patch.sh

  legacy-kernel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install kernel build dependencies
        run: sudo apt-get update && sudo apt-get install --yes bc bison flex libelf-dev libssl-dev

      - name: Build against Linux 7.0 headers
        run: ./tests/build-legacy-kernel.sh
