name: Compatibility matrix

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  WIRELESS_NEXT_REPO: https://git.kernel.org/pub/scm/linux/kernel/git/wireless/wireless-next.git

jobs:
  resolve-source:
    name: Resolve wireless-next source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wireless_sha: ${{ steps.resolve.outputs.wireless_sha }}
    steps:
      - name: Resolve wireless-next main once
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          read -r wireless_sha ref < <(
            git ls-remote --exit-code "$WIRELESS_NEXT_REPO" refs/heads/main
          )
          [[ $wireless_sha =~ ^[0-9a-f]{40}$ ]]
          [[ $ref == refs/heads/main ]]
          printf 'wireless_sha=%s\n' "$wireless_sha" >> "$GITHUB_OUTPUT"
          printf 'wireless-next main resolves to %s.\n' "$wireless_sha"

  static-tests:
    name: Shell and desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test and desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl desktop-file-utils git kmod util-linux

      - name: Check shell syntax
        run: bash -n mt76-rebuild.sh mt76-revert.sh mt76-check.sh scripts/*.sh tests/*.sh

      - name: Test compatibility selection
        run: ./tests/test-compat.sh

      - name: Test normal-user rebuild flow
        run: ./tests/test-rebuild.sh

      - name: Test transactional module overlay
        run: ./tests/test-module-overlay.sh

      - name: Test real depmod transaction isolation
        run: ./tests/test-real-depmod.sh

      - name: Test status reporting
        run: ./tests/test-status.sh

      - name: Validate desktop entries
        run: desktop-file-validate mt76-check.desktop mt76-status.desktop

      - name: Check whitespace errors
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD

      - name: Test workflow contract
        run: ./tests/test-workflow.sh

  api-build:
    name: API compile (${{ matrix.kernel }}, ${{ matrix.toolchain }})
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: v6.18
            toolchain: gcc
            patches: action-frame,eml,nan,aql,alloc-flex,rx-link-sta
          - kernel: v7.0
            toolchain: gcc
            patches: action-frame,eml,nan,aql,rx-link-sta
          - kernel: v7.1
            toolchain: gcc
            patches: eml,nan,aql,rx-link-sta
          - kernel: v7.2
            toolchain: gcc
            patches: aql,rx-link-sta
          - kernel: v7.1
            toolchain: llvm
            patches: eml,nan,aql,rx-link-sta
          - kernel: current-native
            toolchain: gcc
            patches: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GCC, LLVM, and kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc \
            bison \
            build-essential \
            clang \
            dwarves \
            file \
            flex \
            git \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm

      - name: Build API-only source/header check
        shell: bash
        env:
          EXPECTED_PATCHES: ${{ matrix.patches }}
          KERNEL_REF: ${{ matrix.kernel }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          WIRELESS_NEXT_REF: ${{ needs.resolve-source.outputs.wireless_sha }}
        run: |
          set -euo pipefail
          if [[ $TOOLCHAIN == llvm ]]; then
            export LLVM=1
            compiler_command=clang
          else
            unset LLVM
            compiler_command=gcc
          fi
          compiler=$($compiler_command --version)
          compiler=${compiler%%$'\n'*}

          printf 'Kernel ref: %s\n' "$KERNEL_REF"
          printf 'Compiler: %s\n' "$compiler"
          printf 'Source SHA: %s\n' "$WIRELESS_NEXT_REF"
          printf 'Detected features: pending\n'
          printf 'Patch IDs: pending\n'
          printf '%s\n' 'Build mode: API-only; unresolved base-kernel symbols are warnings.'

          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          set +e
          ./tests/build-legacy-kernel.sh 2>&1 | tee "$log"
          build_status=${PIPESTATUS[0]}
          set -e

          if grep -Fqx \
            'API compile check: KBUILD_MODPOST_WARN=1 because modules_prepare has no complete Module.symvers.' \
            "$log"; then
            patch_ids=$(awk '
              /^Compatibility patches:$/ { capture = 1; next }
              /^API compile check:/ { capture = 0 }
              capture && NF { print }
            ' "$log")
            patch_csv=${patch_ids//$'\n'/,}
            [[ -n $patch_csv ]] || patch_csv=none

            feature_state() {
              if grep -Fqx "$1" <<< "$patch_ids"; then
                printf '%s' "$2"
              else
                printf native
              fi
            }
            detected_features=$(printf 'action-frame=%s,eml=%s,nan=%s,aql=%s,alloc-flex=%s,rx-link-sta=%s' \
              "$(feature_state action-frame legacy)" \
              "$(feature_state eml legacy)" \
              "$(feature_state nan disabled)" \
              "$(feature_state aql pre-aql)" \
              "$(feature_state alloc-flex legacy)" \
              "$(feature_state rx-link-sta legacy)")
          else
            detected_features='action-frame=unknown,eml=unknown,nan=unknown,aql=unknown,alloc-flex=unknown,rx-link-sta=unknown'
            patch_csv=unavailable
          fi

          printf 'Detected features: %s\n' "$detected_features"
          printf 'Patch IDs: %s\n' "$patch_csv"
          ((build_status == 0)) || exit "$build_status"
          grep -Fqx "wireless-next $WIRELESS_NEXT_REF resolves to $WIRELESS_NEXT_REF." "$log"
          [[ $patch_csv == "$EXPECTED_PATCHES" ]]

  strict-packaged-header-build:
    name: Strict Fedora Rawhide kernel-devel build
    needs: resolve-source
    runs-on: ubuntu-latest
    container: fedora:rawhide
    timeout-minutes: 45
    steps:
      - name: Install Fedora kernel-devel and build tools
        run: |
          dnf install --assumeyes \
            bc \
            bison \
            dwarves \
            elfutils-libelf-devel \
            file \
            findutils \
            flex \
            gcc \
            git \
            hostname \
            kernel-devel \
            kmod \
            make \
            openssl-devel

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with strict modpost and real Module.symvers
        shell: bash
        env:
          WIRELESS_NEXT_REF: ${{ needs.resolve-source.outputs.wireless_sha }}
        run: |
          set -euo pipefail

          kernel_package=$(rpm -q kernel-devel)
          mapfile -t kdirs < <(
            rpm -ql "$kernel_package" |
              grep -E '^/usr/src/kernels/[^/]+/?$'
          )
          [[ ${#kdirs[@]} -eq 1 ]]
          kdir=${kdirs[0]%/}
          kver=$(make -s -C "$kdir" kernelrelease)
          [[ ${kdir##*/} == "$kver" ]]

          symvers="$kdir/Module.symvers"
          required_headers=(
            include/linux/ieee80211.h
            include/linux/ieee80211-eht.h
            include/linux/ieee80211-nan.h
            include/uapi/linux/nl80211.h
            include/net/cfg80211.h
            include/net/mac80211.h
          )

          source_dir="$RUNNER_TEMP/wireless-next-strict"
          git init --quiet "$source_dir"
          git -C "$source_dir" fetch --depth=1 \
            "$WIRELESS_NEXT_REPO" "$WIRELESS_NEXT_REF"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          source_sha=$(git -C "$source_dir" rev-parse HEAD)
          [[ $source_sha == "$WIRELESS_NEXT_REF" ]]

          compiler=$(gcc --version)
          compiler=${compiler%%$'\n'*}

          printf 'Kernel ref: packaged %s (%s)\n' "$kver" "$kernel_package"
          printf 'Compiler: %s\n' "$compiler"
          printf 'Source SHA: %s\n' "$source_sha"
          printf 'Detected features: pending\n'
          printf 'Patch IDs: pending\n'
          printf 'Module.symvers: %s\n' "$symvers"
          printf '%s\n' 'Build mode: strict modpost; unresolved symbols are errors.'

          [[ -s $symvers ]] || {
            printf 'Required package file is missing: %s\n' "$symvers" >&2
            exit 1
          }
          header_owner=$(rpm -qf "$symvers")
          [[ $header_owner == "$kernel_package" ]]
          for header in "${required_headers[@]}"; do
            [[ -s $kdir/$header ]] || {
              printf 'Required package header is missing: %s\n' "$kdir/$header" >&2
              exit 1
            }
            [[ $(rpm -qf "$kdir/$header") == "$kernel_package" ]]
          done

          set +e
          patch_ids=$(./scripts/compat.sh detect "$kdir")
          detect_status=$?
          set -e
          if ((detect_status != 0)); then
            printf '%s\n' \
              'Detected features: action-frame=unknown,eml=unknown,nan=unknown,aql=unknown,alloc-flex=unknown,rx-link-sta=unknown'
            printf 'Patch IDs: unavailable\n'
            exit "$detect_status"
          fi

          patch_csv=${patch_ids//$'\n'/,}
          [[ -n $patch_csv ]] || patch_csv=none

          feature_state() {
            if grep -Fqx "$1" <<< "$patch_ids"; then
              printf '%s' "$2"
            else
              printf native
            fi
          }
          detected_features=$(printf 'action-frame=%s,eml=%s,nan=%s,aql=%s,alloc-flex=%s,rx-link-sta=%s' \
            "$(feature_state action-frame legacy)" \
            "$(feature_state eml legacy)" \
            "$(feature_state nan disabled)" \
            "$(feature_state aql pre-aql)" \
            "$(feature_state alloc-flex legacy)" \
            "$(feature_state rx-link-sta legacy)")

          printf 'Detected features: %s\n' "$detected_features"
          printf 'Patch IDs: %s\n' "$patch_csv"

          applied=$(./scripts/compat.sh apply "$source_dir" "$kdir")
          [[ $applied == "$patch_ids" ]]

          mt76_dir="$source_dir/drivers/net/wireless/mediatek/mt76"
          make -C "$kdir" M="$mt76_dir" \
            CONFIG_MT76_CORE=m \
            CONFIG_MT76_USB=n \
            CONFIG_MT76_SDIO=n \
            CONFIG_MT76x02_LIB=n \
            CONFIG_MT76x02_USB=n \
            CONFIG_MT76_CONNAC_LIB=m \
            CONFIG_MT792x_LIB=m \
            CONFIG_MT792x_USB=n \
            CONFIG_MT76_NPU= \
            CONFIG_MT76x0_COMMON=n \
            CONFIG_MT76x2_COMMON=n \
            CONFIG_MT7603E=n \
            CONFIG_MT7615_COMMON=n \
            CONFIG_MT7915E=n \
            CONFIG_MT7921_COMMON=n \
            CONFIG_MT7996E=n \
            CONFIG_MT7925_COMMON=m \
            CONFIG_MT7925E=m \
            CONFIG_MT7925U=n \
            modules -j"$(nproc)"

          expected_modules=(
            "$mt76_dir/mt76-connac-lib.ko"
            "$mt76_dir/mt76.ko"
            "$mt76_dir/mt7925/mt7925-common.ko"
            "$mt76_dir/mt7925/mt7925e.ko"
            "$mt76_dir/mt792x-lib.ko"
          )
          mapfile -t modules < <(
            find "$mt76_dir" -type f -name '*.ko' -print | LC_ALL=C sort
          )
          [[ ${#modules[@]} -eq 5 ]]
          for index in "${!expected_modules[@]}"; do
            [[ ${modules[$index]} == "${expected_modules[$index]}" ]]
          done

          require_dependency() {
            local dependencies=${1//-/_}
            [[ ,$dependencies, == *",$2,"* ]]
          }
          for module in "${modules[@]}"; do
            [[ -s $module ]]
            vermagic=$(modinfo -F vermagic "$module")
            read -r module_kver _ <<< "$vermagic"
            [[ $module_kver == "$kver" ]]
            depends=$(modinfo -F depends "$module")
            [[ -n $depends ]]
            case ${module##*/} in
              mt76.ko)
                require_dependency "$depends" mac80211
                require_dependency "$depends" cfg80211
                ;;
              mt76-connac-lib.ko)
                require_dependency "$depends" mt76
                ;;
              mt792x-lib.ko)
                require_dependency "$depends" mt76_connac_lib
                ;;
              mt7925-common.ko)
                require_dependency "$depends" mt792x_lib
                ;;
              mt7925e.ko)
                require_dependency "$depends" mt7925_common
                ;;
            esac
            printf 'Module: %s; vermagic: %s; depends: %s\n' \
              "${module##*/}" "$vermagic" "$depends"
          done
